services:
  # Nginx 서비스 추가
  nginx:
    image: nginx:latest  # 공식 Nginx 이미지 사용
    container_name: nginx-container
    ports:
      - "80:80"  # 외부 80번 포트로 접근 가능하게 설정
    volumes:
      - /etc/nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # 설정 파일 적용
      - /var/log/nginx:/var/log/nginx  # Nginx 로그 파일 마운트 추가
    depends_on:
      - backend-container
      - frontend-container
      - ai-container
    networks:
      - baseball-server_default

  # 기존 Backend
  backend-container:
    image: baseball-server-backend:latest
    container_name: backend-container
    ports:
      - "3001:3000"
    restart: always
    networks:
      - baseball-server_default

  # 기존 Frontend
  frontend-container:
    image: baseball-server-frontend:latest
    container_name: frontend-container
    ports:
      - "5000:5000"
    restart: always
    networks:
      - baseball-server_default

  # 기존 AI 서비스
  ai-container:
    image: baseball-server-ai:latest
    container_name: ai-container
    ports:
      - "8000:8000"
    restart: always
    networks:
      - baseball-server_default

networks:
  baseball-server_default:
    driver: bridge
