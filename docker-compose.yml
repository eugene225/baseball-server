services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile # 상대 경로
    container_name: backend
    ports:
      - "3000:3000"
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile # 상대 경로
    container_name: frontend
    ports:
      - "5000:5000"
    restart: always
