name: main branch auto ci process script

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to AWS EC2 with Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}  # ECR 리전 지정

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        with:
          region: ${{ secrets.AWS_REGION }}  # ECR 리전 지정

      # Backend Docker 이미지 빌드
      - name: Build Backend Docker image
        run: |
          cd backend
          docker build -t DockerFile .

      # Frontend Docker 이미지 빌드
      - name: Build Frontend Docker image
        run: |
          cd frontend
          docker build -t DockerFile .

      # Backend Docker 이미지 태그 및 푸시
      - name: Tag and Push Backend Docker image to ECR
        run: |
          docker tag backend-image:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repository:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repository:latest

      # Frontend Docker 이미지 태그 및 푸시
      - name: Tag and Push Frontend Docker image to ECR
        run: |
          docker tag frontend-image:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repository:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repository:latest

      - name: Execute remote SSH commands on EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          script: |
            # EC2에 SSH로 접속하여 Docker 컨테이너 실행

            # 1. 기존 Docker 컨테이너 중지 및 삭제 (있으면 삭제)
            docker stop backend-container || true
            docker rm backend-container || true
            docker stop frontend-container || true
            docker rm frontend-container || true

            # 2. ECR에서 Backend, Frontend Docker 이미지 풀(pull)
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repository:latest
            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repository:latest

            # 3. 새 컨테이너 실행 (Backend: 포트 5000, Frontend: 포트 80)
            docker run -d --name backend-container -p 5000:5000 ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-backend-repository:latest
            docker run -d --name frontend-container -p 80:80 ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/my-frontend-repository:latest

            # 4. 필요 시 환경 변수 설정
            echo "${{ secrets.ENV }}" > /home/ec2-user/app/baseball-server/backend/.env
